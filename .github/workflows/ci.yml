name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Windows)
    # Pinned to 2022 on purpose: windows-latest is now Windows Server 2025 with
    # VS 2026, whose image only carries the WDK Visual Studio extension and not
    # the full Windows Driver Kit, so ntddk.h is missing and the driver will not
    # compile.  windows-2022 ships the complete WDK.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        shell: pwsh
        run: |
          $unformatted = gofmt -l ./cmd
          if ($unformatted) {
            Write-Host "These files are not gofmt-formatted:"
            Write-Host $unformatted
            exit 1
          }

      - name: Vet
        run: go vet ./cmd/keyboardctl/

      - name: Test
        run: go test -trimpath ./cmd/keyboardctl/

      - name: Build CLI
        run: go build -trimpath -ldflags "-s -w" -o build/keyboardctl.exe ./cmd/keyboardctl

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build driver
        run: msbuild driver\driver.vcxproj /p:Configuration=Release /p:Platform=x64 /m /nologo

      # An INF that fails infverif makes pnputil refuse the package on the user's
      # machine, where it is hard to diagnose.  Check it here instead.  /h is the
      # WHQL signature bar, which a class filter legitimately passes.
      - name: Verify the INF
        shell: pwsh
        run: |
          $inf = 'driver\x64\Release\keyboardctl.inf'
          if (-not (Test-Path $inf)) { throw "stamped INF not produced: $inf" }
          $tool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Tools\*\x64\infverif.exe' |
                  Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { throw "infverif.exe not found in the WDK" }
          & $tool.FullName /h $inf
          if ($LASTEXITCODE -ne 0) { throw "infverif /h failed (exit $LASTEXITCODE)" }

      # The release job packages the driver straight from the build tree, so assert
      # the layout it relies on here, where a pull request can catch a regression.
      # Inf2Cat puts the catalog in the package subdirectory ($(OutDir)<project>\)
      # alongside the .sys and stamped .inf, and pnputil needs all three together.
      - name: Verify the driver package layout
        shell: pwsh
        run: |
          $cat = Get-ChildItem driver\x64\Release -Recurse -Filter keyboardctl.cat |
                 Select-Object -First 1
          if (-not $cat) { throw "keyboardctl.cat was not produced (Inf2Cat did not run)" }
          $pkg = $cat.DirectoryName
          Write-Host "driver package directory: $pkg"
          foreach ($f in 'keyboardctl.inf', 'keyboardsimulator.sys', 'keyboardctl.cat') {
            if (-not (Test-Path (Join-Path $pkg $f))) { throw "$f is missing from $pkg" }
          }
          # A test signature is not trusted on the runner, so require a signature
          # that matches the file rather than status 'Valid'.
          foreach ($f in 'keyboardsimulator.sys', 'keyboardctl.cat') {
            $sig = Get-AuthenticodeSignature (Join-Path $pkg $f)
            Write-Host "$f : $($sig.Status)"
            if (-not $sig.SignerCertificate) { throw "$f is not signed" }
          }
